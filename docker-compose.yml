services:
  backend:
    build:
      context: ./backend
    container_name: raven-backend
    env_file:
      - ./.env
    environment:
      DATABASE_URL: sqlite:////data/raven.db
      FRONTEND_ORIGIN: http://localhost:3000
      EMBEDDED_MONITORING: ${EMBEDDED_MONITORING:-false}
      FLOCK_SERVER_URL: http://flock:8000/api/flock
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - raven-data:/data
    restart: unless-stopped

  runner:
    build:
      context: ./backend
    container_name: raven-runner
    command: ["python", "-m", "app.services.execution_runner"]
    env_file:
      - ./.env
    environment:
      DATABASE_URL: sqlite:////data/raven.db
      FRONTEND_ORIGIN: http://localhost:3000
      EMBEDDED_MONITORING: "false"
      FLOCK_SERVER_URL: http://flock:8000/api/flock
    depends_on:
      - backend
      - flock
    volumes:
      - raven-data:/data
    restart: unless-stopped

  flock:
    build:
      context: ./backend
    container_name: raven-flock
    command: ["uvicorn", "app.main_flock:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - ./.env
    environment:
      DATABASE_URL: sqlite:////data/raven.db
      EMBEDDED_MONITORING: "false"
    depends_on:
      - backend
    volumes:
      - raven-data:/data
    restart: unless-stopped

  flock-test:
    profiles: ["agent"]
    build:
      context: ./backend
    container_name: flock-test
    hostname: flock-test
    command: ["python", "-m", "app.services.flock_agent"]
    environment:
      FLOCK_SERVER_URL: http://flock:8000/api/flock
      FLOCK_ENROLLMENT_TOKEN: ${FLOCK_ENROLLMENT_TOKEN:-}
      FLOCK_AGENT_NAME: flock-test
      FLOCK_AGENT_STATE_PATH: /agent-state/flock-agent-state.json
    depends_on:
      - flock
    volumes:
      - flock-test-state:/agent-state
    restart: "no"

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api
    container_name: raven-frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api
    depends_on:
      - backend
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

volumes:
  raven-data:
  flock-test-state:
